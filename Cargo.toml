[workspace]
members = [
  "http",
  "cli",
  "lib",
  "lib/cbindings",
  "lib/web",
]
resolver = "2"

default-members = [
  "http",
  "cli",
  "lib",
  "lib/cbindings",
]

# Fix for getrandom 0.3.x compatibility with wasm32-unknown-unknown target 
[workspace.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

# $ cargo release
[workspace.metadata.release]
sign-tag = true
tag-prefix = "{{crate_name}}/"
tag-message = "Release {{crate_name}} version {{version}}."
pre-release-commit-message = "Release"
