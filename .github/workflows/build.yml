name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SSI_REF: 9a4acff913370dbc0f7f796238d6b88731263bc1
  RUST_TOOLCHAIN: 1.98.0
  ANDROID_NDK_VERSION: '30.0.16248370'
  RUSTFLAGS: "-Dwarnings"

defaults:
  run:
    working-directory: didkit

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout DIDKit repository
      uses: actions/checkout@v3
      with:
        path: didkit
        submodules: true

    - name: Checkout SSI library
      uses: actions/checkout@v3
      with:
        repository: learningeconomy/ssi
        path: ssi
        ref: ${{env.SSI_REF}}
        submodules: true

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          didkit

    - name: Build
      run: cargo build --locked

    - name: Test
      run: cargo test --locked

    - name: Test CLI
      run: cli/tests/example.sh

    - name: Test CLI with ssh-agent
      run: cli/tests/ssh-agent.sh

    - name: Test CLI (did:tz)
      env:
        DID_METHOD: tz
      run: cli/tests/example.sh

    - name: Test CLI (JWT)
      env:
        PROOF_FORMAT: jwt
      run: cli/tests/example.sh

    - name: Test CLI (reject raw JWT VC in LDP VP)
      env:
        VC_PROOF_FORMAT: jwt
      run: cli/tests/example.sh

    - name: Test CLI (LDP VC in JWT VP)
      env:
        VP_PROOF_FORMAT: jwt
      run: cli/tests/example.sh

    - name: Install wasm-pack
      run: make -C lib install-wasm-pack

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.7.12'

    - name: Opt out of Dart/Flutter analytics
      run: |
        dart --disable-analytics
        flutter --suppress-analytics config --no-analytics

    - name: Test C FFI
      run: make -C lib ../target/test/c.stamp

    - name: Test WASM package
      env:
        RUSTFLAGS: '-Dwarnings --cfg getrandom_backend="wasm_js"'
      run: make -C lib ../target/test/wasm.stamp

    - name: Test JNI
      run: make -C lib ../target/test/java.stamp

    - name: Test Dart/Flutter plugin
      run: make -C lib ../target/test/flutter.stamp

    - name: Install Rust Android target
      run: rustup target add i686-linux-android
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
    - name: Install NDK
      run: sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
    - name: Build Android Archive
      run: |
        export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
        export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
        TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
        export PATH="$TOOLCHAIN:$PATH"
        export CC_i686_linux_android="$TOOLCHAIN/i686-linux-android21-clang"
        export AR_i686_linux_android="$TOOLCHAIN/llvm-ar"
        cargo build --locked --lib --target i686-linux-android

  test_http:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # di-ed25519-test-suite fails one test because issuer != proof VM
        # did-key-test-suite requires more checks in ssi
        # di-eddsa-2022-test-suite passes but currently it's depending on a (npm) git branch that doesn't exist anymore
        suite: ["vc-api-issuer-test-suite", "vc-api-verifier-test-suite"] # "di-eddsa-2022-test-suite", "di-ed25519-test-suite", "did-key-test-suite"]
    steps:
    - name: Checkout DIDKit repository
      uses: actions/checkout@v3
      with:
        path: didkit
        submodules: true
    - name: Checkout SSI library
      uses: actions/checkout@v3
      with:
        repository: learningeconomy/ssi
        path: ssi
        ref: ${{env.SSI_REF}}
        submodules: true
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          didkit
        shared-key: "vc-api"
    - uses: actions/setup-node@v3
      with:
        node-version: 22
    - name: Start VC API
      run: |
        cd http
        cargo build --locked
        DIDKIT_HTTP_ISSUER_KEYS='[{"kty":"OKP","crv":"Ed25519","x":"HvjBEw94RHAh9KkiD385aYZNxGkxIkwBcrLBY5Z7Koo","d":"1onWu34oC29Y09qCRl0aD2FOp5y5obTqHZxQQRT3-bs"}]' cargo run --locked &
    - name: Start HTTPS Proxy
      run: npx local-ssl-proxy --source 9000 --target 3000 --hostname 127.0.0.1 &
    - name: Setup Test Suite
      run: |
        cd http/tests/${{ matrix.suite }}
        npm i
        rm node_modules/vc-api-test-suite-implementations/implementations/*.json
        ln ../vcApiTestImplementationsConfig.cjs .vcApiTestImplementationsConfig.cjs
    - name: Run Test Suite
      run: |
        cd http/tests/${{ matrix.suite }}
        ISSUER_NAME="Spruce" KEY_SEED_DB=z1Aaj5A4UCsdMpXwdYAReXa4bxWYiKJtdAvB1zMzCHtCbtD npm test

  build_ios:
    runs-on: macos-latest
    steps:
    - name: Checkout DIDKit repository
      uses: actions/checkout@v3
      with:
        path: didkit

    - name: Checkout SSI library
      uses: actions/checkout@v3
      with:
        repository: learningeconomy/ssi
        path: ssi
        ref: ${{env.SSI_REF}}
        submodules: true

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          didkit

    - name: Install Rust iOS targets
      run: make -C lib install-rustup-ios

    - name: Build iOS Library
      run: |
        device_id="$(xcrun simctl list devices available --json | jq -r \
          '[.devices | to_entries[] | select(.key | contains(".iOS-")) | .value[] |
            select(.isAvailable and (.name | startswith("iPhone")))][0].udid // empty')"
        test -n "${device_id}"
        make -C lib ../target/test/ios.stamp \
          IOS_TEST_DESTINATION="platform=iOS Simulator,id=${device_id}"

  build_windows:
    runs-on: windows-latest
    steps:
    - name: Checkout DIDKit repository
      uses: actions/checkout@v3
      with:
        path: didkit

    - name: Checkout SSI library
      uses: actions/checkout@v3
      with:
        repository: learningeconomy/ssi
        path: ssi
        ref: ${{env.SSI_REF}}
        submodules: true

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          didkit

    - name: Build
      run: cargo build --locked
