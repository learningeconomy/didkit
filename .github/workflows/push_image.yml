name: Publish Docker

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  release:
      types: [published, created, edited]
  workflow_dispatch:

env:
  SSI_REF: 9e2783f9f759fc92617f6c27b1c77ec0599cf9a0

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout DIDKit repository
      uses: actions/checkout@v3
      with:
        path: didkit
        submodules: true
        persist-credentials: false
    - name: Checkout SSI library
      uses: actions/checkout@v3
      with:
        repository: learningeconomy/ssi
        path: ssi
        ref: ${{ env.SSI_REF }}
        submodules: true
        persist-credentials: false
    - uses: docker/setup-buildx-action@v2
    - uses: docker/metadata-action@v4
      id: meta
      with:
        images: |
          ghcr.io/${{ github.repository_owner }}/didkit-http
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=ref,event=tag
          type=sha,prefix={{date 'YYYYMMDDHHmmss'}}
          type=raw,value=latest,enable={{is_default_branch}}
    - uses: docker/login-action@v2
      if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v4
      with:
        push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release') }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        context: .
        file: didkit/http/Dockerfile
