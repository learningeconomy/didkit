[package]
name = "didkit-wasm"
version = "0.4.0"
authors = ["Spruce Systems, Inc."]
edition = "2018"

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
thiserror = "1.0"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
# rand_chacha 0.3 uses rand_core 0.6 / getrandom 0.2, a separate feature graph.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
chrono = { version = "0.4", features = ["wasmbind"] }
iref = "^2.0.3"
rand_chacha = "0.3"
# jwe.rs needs StaticSecret. pgp (did:webkey) used to turn this feature on for us.
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
curve25519-dalek = "4.0"
aes-gcm = "0.10"
base64 = "0.21"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
hkdf = "0.12"
sha2 = "0.10"
base64url = "0.1"
bs58 = "0.5"
chacha20poly1305 = "0.10"
byteorder = "1.5.0"
libipld = { version = "0.16", features = ["serde-codec"]}
unsigned-varint = "0.7.0"

[dependencies.didkit]
path = "../"
default-features = false
features = ["ed25519", "rsa", "ripemd-160", "eip", "tezos", "secp256r1"]

[dependencies.did-ethr]
path = "../../../ssi/did-ethr"
default-features = false

# Subtractive ssi features that keep big, rarely used pieces out of the WASM.
# They only apply to this crate's build graph (LC-2429).
[dependencies.ssi-json-ld]
path = "../../../ssi/ssi-json-ld"
default-features = false
# schema.org and W3C CCG traceability contexts (~323 KB): callers pass them in
# the context map when they need them.
features = ["omit-large-contexts"]

[dependencies.ssi-vc]
path = "../../../ssi/ssi-vc"
# JSON Schema (credentialSchema) validation and the regex engine behind it
# (~925 KB): a credentialSchema check returns a warning instead.
features = ["omit-json-schema"]

[dev-dependencies]
wasm-bindgen-test = "0.2"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

[lib]
crate-type = ["cdylib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
# zcap exports (invoke, delegate) are opt-in: LearnCard doesn't call them and they cost ~45 KB.
default = ["generate", "issue", "verify"]

generate = []
issue = []
verify = []
credential = []
presentation = []
delegate = []
invoke = []
zcap = []
